name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------
  # App checks: lint, types, unit tests, production build.
  #
  # Lint runs the ESLint CLI (`npm run lint` -> `eslint . --max-warnings=0`)
  # against the flat config in eslint.config.mjs (next/core-web-vitals +
  # next/typescript). We migrated off the deprecated `next lint` (removed in
  # Next 16); `next build` no longer lints either (eslint.ignoreDuringBuilds
  # in next.config.mjs), so this is the single lint gate. Zero warnings are
  # tolerated — suppress intentional exceptions with an inline eslint-disable.
  # ---------------------------------------------------------------------
  app-checks:
    name: App checks (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # `next build` prerenders every route. Each page is a "use client"
      # component that imports lib/supabase/client.ts, which THROWS at module
      # load if NEXT_PUBLIC_SUPABASE_* are unset ("Missing Supabase env vars.").
      # These are public anon-tier values and need not be real for a build, so
      # we pass harmless placeholders to let the module-load guard pass.
      # (Verified: with these unset the build exits 1; with placeholders it
      # exits 0.)
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  # ---------------------------------------------------------------------
  # DB tests: ephemeral LOCAL Supabase stack on the runner, pgTAP.
  #
  # No cloud credentials and no link to the live project -- the stack is
  # spun up locally (GitHub runners provide Docker). `supabase start`
  # applies the migrations (baseline schema, then save_recipe) and seed.sql
  # to a fresh database, then `supabase test db` runs the pgTAP suite in
  # supabase/tests/. This matches the official Supabase CI example.
  # ---------------------------------------------------------------------
  db-tests:
    name: DB tests (Supabase + pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the CLI release the suite was verified against locally
      # (2026-07-01, Postgres 17 matching prod 17.6). Bump deliberately, never
      # float on `latest` — CLI/image drift can turn green runs red with no
      # repo change.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      # `supabase start` applies all migrations (baseline schema incl. explicit
      # Data API grants, then the forward migrations) and seed.sql to a fresh
      # DB. Services the pgTAP path never touches are excluded — fewer image
      # pulls, faster runs; the same list also works around the Colima
      # docker.sock mount bug in `vector` for local runs, keeping local and CI
      # invocations identical.
      - name: Start local Supabase stack
        run: supabase start -x vector,logflare,realtime,imgproxy,studio,edge-runtime,mailpit,supavisor

      # NOTESTS guard: pg_prove exits 0 when it discovers ZERO test files, so a
      # broken glob or moved tests directory would read as green while testing
      # nothing. Fail loudly instead. (pipefail preserves the real pg_prove
      # exit code through the tee.)
      - name: Run pgTAP tests
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee /tmp/pgtap-output.txt
          if grep -q "Result: NOTESTS" /tmp/pgtap-output.txt; then
            echo "::error::pg_prove discovered no test files (NOTESTS) — test discovery is broken"
            exit 1
          fi

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
