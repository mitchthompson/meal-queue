# Local Supabase config for ephemeral CI / local testing ONLY.
#
# This drives `supabase start`, `supabase db reset`, and `supabase test db`.
# It never points at the live cloud project (no remote project ref / linking
# here), so the db-tests CI job needs no cloud credentials. Prod stays
# hand-applied via the Supabase SQL editor and is untouched by this pipeline.

project_id = "meal-queue-local"

[db]
# Local Postgres port.
port = 54322
# Shadow DB port used by `supabase db diff` (unused in CI, but must be valid).
shadow_port = 54320
# MUST equal the live database's major version so CI/local tests run the same
# engine as prod. Confirmed 2026-07-01 via `SHOW server_version;` on prod:
# 17.6 -> major_version 17. The CLI pulls the matching Postgres image
# automatically. Re-confirm if the Supabase project is ever upgraded.
major_version = 17

[db.seed]
# Seed runs after migrations on `supabase start` / `supabase db reset`.
# Our pgTAP test seeds and rolls back all of its own fixtures, so this points at
# an intentionally inert, version-controlled file (the documented default).
enabled = true
sql_paths = ["./seed.sql"]

# Auth/API are left enabled (CLI defaults). The DB-only pgTAP job does not call
# them, but `supabase start` boots the GoTrue/auth container regardless, which
# provisions the `auth` schema, `auth.users`, `auth.uid()`, and the
# `authenticated` / `service_role` roles the tests rely on. Keeping these on is
# harmless on a CI runner.
[auth]
enabled = true

[api]
enabled = true

[studio]
enabled = false
